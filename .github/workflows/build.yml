name: build

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'components/**'
      - 'tests/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'components/**'
      - 'tests/**'
      - '.github/workflows/build.yml'

jobs:
  reference-tests:
    name: reference tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest
      - run: pytest tests/ -v

  esp-idf:
    name: esp-idf / ${{ matrix.app }} (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: gateway
            target: esp32s3
          - app: scanner
            target: esp32
          - app: relay
            target: esp32s3
          - app: tag
            target: esp32s3
    steps:
      - uses: actions/checkout@v4

      # Generate throwaway crypto material — the repo ships none.
      # These keys live only on the CI runner and are discarded when
      # the job ends; no leak risk. See SECURITY.md for the real
      # per-deployment regen story.
      - name: Generate throwaway signing key + TLS bundle
        run: |
          mkdir -p secure_boot_keys
          openssl genrsa -out secure_boot_keys/bmt_fleet_rsa3072.pem 3072
          (cd thingsboard/tls && bash gen_certs.sh)

      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: latest
          target: ${{ matrix.target }}
          path: apps/${{ matrix.app }}

  zephyr:
    name: zephyr / ${{ matrix.app }} (${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: Beacon_ProMicroNrf52840
            board: promicro_nrf52840/nrf52840/uf2
          - app: Beacon_XiaoNrf52840
            board: xiao_ble/nrf52840
    steps:
      - uses: actions/checkout@v4
        with:
          path: bmt

      # Throwaway MCUboot signing key — same rationale as the
      # esp-idf job above.
      - name: Generate throwaway MCUboot key
        run: |
          mkdir -p bmt/mcuboot_keys
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 \
              -out bmt/mcuboot_keys/bmt_tag_ecdsa_p256.pem

      - uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: bmt/apps/${{ matrix.app }}
          toolchains: arm-zephyr-eabi

      - name: west build
        working-directory: bmt/apps/${{ matrix.app }}
        run: west build -b ${{ matrix.board }} --pristine
