name: build

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'components/**'
      - 'tests/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'components/**'
      - 'tests/**'
      - '.github/workflows/build.yml'

jobs:
  reference-tests:
    name: reference tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest
      - run: pytest tests/ -v

  esp-idf:
    name: esp-idf / ${{ matrix.app }} (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: gateway
            target: esp32s3
          - app: scanner
            target: esp32
          - app: relay
            target: esp32s3
          - app: tag
            target: esp32s3
    steps:
      - uses: actions/checkout@v4

      # Generate throwaway crypto material — the repo ships none.
      # These keys live only on the CI runner and are discarded when
      # the job ends; no leak risk. See .github/SECURITY.md for the
      # real per-deployment regen story.
      - name: Generate throwaway signing key + TLS bundle
        run: |
          mkdir -p keys
          openssl genrsa -out keys/bmt_fleet_rsa3072.pem 3072
          (cd thingsboard/tls && bash gen_certs.sh)

      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: latest
          target: ${{ matrix.target }}
          path: apps/${{ matrix.app }}

  # Beacon nRF52840 variants (Zephyr / MCUboot) are marked experimental
  # in their per-app READMEs and built by hand — not covered by CI.
