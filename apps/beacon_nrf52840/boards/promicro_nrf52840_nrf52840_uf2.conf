# ProMicro nRF52840 - merged on top of prj.conf.

# [POWER] Turn off the soft switch that feeds power to the external VCC pin
# (P0.13) - saves ~0.1 mA. Needs the GPIO driver. See src/main.c and the
# overlay for the schematic detail.
CONFIG_GPIO=y

# =====================================================================
# [POWER] KEY DIFFERENCE VS XIAO - DC/DC regulator
# =====================================================================
#
# The nRF52840 has TWO separate DC/DC regulators for two power architectures:
#
#  - REG1 ("normal voltage"): used when VDD is fed by an external LDO that
#    has already stepped the rail down. This is the XIAO case (battery ->
#    BQ25101 -> LDO SGM2040 3.3 V). The XIAO board devicetree ships both
#    regulators enabled:
#         &reg0 { status = "okay"; };
#         &reg1 { regulator-initial-mode = <NRF5X_REG_MODE_DCDC>; };
#    plus the L3 10 uH inductor between DCC / DEC4.
#
#  - REG0 ("high voltage"): used when the battery wires directly into VDDH
# - the ProMicro / nice!nano v2 architecture.
#
# The ProMicro board in Zephyr does NOT configure reg0 / reg1 at all, so both
# stay at their defaults (REG1 in LDO mode, not DCDC).
#
# NOTE: the two legacy Kconfig symbols (CONFIG_SOC_DCDC_NRF52X / _HV) are
# DEPRECATED in this Zephyr version - DCDC must be enabled through
# DEVICETREE as shown above, not through prj.conf. (The
# CONFIG_BOARD_ENABLE_DCDC_HV symbol some ZMK guides mention is a ZMK-only
# thing and does not exist in upstream Zephyr.)
#
# NOT enabled in the initial version - DELIBERATE:
#   1) Cannot confirm this clone board has the inductor DCDC needs.
#   2) Real-world data from the ZMK community (issue zmkfirmware/zmk#2990)
#      shows enabling DC/DC HV mode on this class of board can INCREASE
#      current:
#         - Official nice!nano: +0.12-0.48 mA standby (up 20-25%)
#         - Clone boards: +1.30-1.32 mA (!!)
#      Suspicion: clones drop the inductor, so the switcher misbehaves
#      and draws more than the LDO would.
#
# => PLAN: measure current at the default first, then try enabling DCDC via
#    devicetree and remeasure. Only keep it if the numbers actually improve.

# =====================================================================
# [POWER] [TODO - not done, deliberate] Turn off unused peripherals
# =====================================================================
# The ProMicro board enables more peripherals than XIAO: i2c0, i2c1, pwm0,
# spi2, uart0 (see promicro_nrf52840_nrf52840_common.dts). This beacon app
# uses none of them, so disabling in principle would save a bit more.
#
# NOT done in the initial version: first want a WORKING image plus baseline
# current measurement, then disable one at a time AND remeasure to confirm
# each step. (Lesson from the XIAO variant: disabling SPI2 was thought to
# have hung the board, wasted hours debugging - the real culprit was
# flashing an unsigned app image. Since then, verify one config change at
# a time; don't change many things at once.)
#
# WATCH OUT: pwm0 is referenced by the "pwmleds" node (red_pwm_led);
# disabling pwm0 without handling that node will break the build.
