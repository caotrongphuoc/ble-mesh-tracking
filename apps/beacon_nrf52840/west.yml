# Freestanding Zephyr application manifest. Lets `west init -l .` set up
# a workspace that pulls in upstream Zephyr next to this app, without
# requiring the whole nRF Connect SDK.
manifest:
  self:
    path: apps/beacon_nrf52840
  remotes:
    - name: zephyrproject
      url-base: https://github.com/zephyrproject-rtos
  projects:
    - name: zephyr
      remote: zephyrproject
      revision: v4.0.0
      import:
        name-allowlist:
          - hal_nordic
          - mcuboot
          - cmsis
          - segger
          - tinycrypt
