# Common to every board. Board-specific Kconfig lives in
# boards/<board>.conf (merged automatically by Zephyr).

CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="Test beacon"

# PSA Crypto (HMAC-SHA256) - needed by bmt_auth for epoch key rotation.
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y

# [POWER] Drop the radio TX power from the default 0 dBm to -4 dBm. Cuts
# current at TX (also reduces the current pulse amplitude through the
# diode / cap - see the CR2032 sag discussion in README), at the cost of
# slightly shorter range - re-verify real-world distance after flashing.
CONFIG_BT_CTLR_TX_PWR_MINUS_4=y

# [POWER] Read the battery via the SAADC - channel per board in
# boards/<board>.overlay, conversion in src/bmt_battery_<board>.c.
CONFIG_ADC=y

# =====================================================================
# [POWER] Disable USB + CONSOLE + LOG - the largest single saving (~0.7-0.8 mA)
# =====================================================================
#
# Both boards use USB CDC-ACM as their console (no dedicated UART for
# debug), so just having CONFIG_CONSOLE=y drags in the full USB device
# stack and keeps it running forever: CONFIG_USB_DEVICE_STACK_NEXT +
# CONFIG_UDC_NRF. Because CONFIG_PM_DEVICE is not enabled, nothing
# suspends them -> current is drawn continuously EVEN AFTER the USB
# cable is unplugged.
#
# Measured on ProMicro (running from battery, USB unplugged, DT-9205A on
# the 200 mA range):
#   Full firmware (with USB / log)         1.7 mA
#   Empty firmware (no USB / log / BLE)    1.0 mA   <- the 0.7 mA diff is USB
#   Empty firmware + P0.13 LOW             0.9 mA   <- hardware floor, nothing to do
#
# DEBUG NOTE: turning this off means NO COM port and NO log. When you need
# logs, build with debug.conf to bring them back (see README, Build).
#
# Trying just CONFIG_LOG=n does NOT help - it only stops printing; the USB
# stack still initialises and runs. You must disable the console for the
# USB stack to actually be dropped from the build.
# THIS is the right switch (one line, instead of picking off each symbol).
# See zephyr/boards/common/usb/Kconfig.cdc_acm_serial.defconfig - the whole
#     if BOARD_SERIAL_BACKEND_CDC_ACM
#         config SERIAL                          default y
#         config CONSOLE                         default y
#         config USB_DEVICE_STACK_NEXT           default y if !MCUBOOT
#         config CDC_ACM_SERIAL_INITIALIZE_AT_BOOT  default y if !MCUBOOT
# block hangs off this switch, so disabling it drops the whole cluster.
#
# Turn off BOTH lines at the same time (do not split): CONFIG_LOG=n is
# what drops log_backend_uart.c from the build. Picking off
# CONFIG_CONSOLE / UART_CONSOLE / SERIAL=n one at a time does NOT work -
# .config still has USB_DEVICE_STACK_NEXT=y and UDC_NRF=y, and the build
# fails with "undefined reference __device_dts_ord_N" because the log /
# CDC-ACM backend is still compiled while its device was dropped from
# devicetree (hit on both boards).
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_LOG=n
