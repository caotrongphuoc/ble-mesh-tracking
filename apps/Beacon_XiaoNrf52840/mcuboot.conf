# [SECURITY] MCUboot on nRF52840 boards uses USB CDC-ACM as its default
# console (the board has no dedicated debug UART), but MCUboot does NOT
# enable the USB stack (minimal bootloader, does not need it). Result:
# missing driver link -> "undefined reference to __device_dts_ord_N".
# MCUboot has nothing useful to print anyway (only verifies signature
# and jumps to slot0_partition), so disabling the console is the
# simplest fix - and reduces attack surface (no version / debug info
# leaked over serial).
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=n
