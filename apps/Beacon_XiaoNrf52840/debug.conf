# =====================================================================
# DEBUG BUILD - re-enable console / log over USB CDC-ACM
# =====================================================================
#
# prj.conf (production) DISABLES USB + console + log because they draw
# ~0.7-0.8 mA continuously even after the USB cable is unplugged - 
# see the full explanation in prj.conf.
#
# This file re-enables them so you can read logs for debugging. DO NOT
# USE FOR CURRENT MEASUREMENT: the reading will be ~0.7-0.8 mA higher
# than the real firmware.
#
# Build command:
#   west build -b xiao_ble/nrf52840 -d build_debug . --pristine \
#       -- "-DBeacon_XiaoNrf52840_EXTRA_CONF_FILE=debug.conf"
#
# (The "Beacon_XiaoNrf52840_" prefix is required - this is a sysbuild
#  multi-image build; without the prefix CMake configure will fail.)

# Re-enable the switch that prj.conf turned off. This drags in the
# whole cluster: SERIAL, CONSOLE, UART_CONSOLE, USB_DEVICE_STACK_NEXT,
# CDC_ACM_SERIAL_INITIALIZE_AT_BOOT (see prj.conf for the detail).
#
# NOTE: setting only CONFIG_CONSOLE=y / SERIAL=y without this line is
# USELESS - the console comes up but there is no UART device to send
# output to, so no COM port appears. (Been caught by this once on
# ProMicro.)
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=y
CONFIG_LOG=y

# Bump the USB buffer pool to avoid "udc: Failed to allocate net_buf N"
# when USB control transactions and CDC-ACM log traffic overlap (after
# SUSPEND / RESUME).
CONFIG_UDC_BUF_POOL_SIZE=4096
CONFIG_UDC_BUF_COUNT=32
