# [SECURITY] MCUboot - the Zephyr counterpart to Secure Boot V2 on ESP32 Tag.
# Single-slot mode: MCUboot only verifies the signature and boots
# slot0_partition. OTA over BLE is not supported yet (updates = re-flash
# the whole UF2 via the pre-installed Adafruit bootloader, see
# boards/xiao_ble_nrf52840.overlay for why the layout is this way).
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_SINGLE_APP=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="../../keys/bmt_tag_ecdsa_p256.pem"
