CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="Test beacon"

# PSA Crypto (HMAC-SHA256) - needed by bmt_auth for epoch key rotation.
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y

# [POWER] Drop the radio TX power from the default 0 dBm to -4 dBm. Cuts
# current at TX (also reduces the current pulse amplitude through the
# diode / cap - see bmt_battery.c and the CR2032 sag discussion), at the
# cost of slightly shorter range - re-verify real-world distance after
# flashing.
CONFIG_BT_CTLR_TX_PWR_MINUS_4=y

# [POWER] Read the battery via the internal SAADC (VDD) - see bmt_battery.c.
CONFIG_ADC=y

# =====================================================================
# [POWER] Disable USB + CONSOLE + LOG - the largest single saving (~0.7-0.8 mA)
# =====================================================================
#
# First tried disabling USB on this board by picking off individual
# symbols (CONFIG_CONSOLE / UART_CONSOLE / SERIAL=n one at a time) and hit
# a build error: "undefined reference __device_dts_ord_125" in
# log_backend_uart.c - because CONFIG_LOG stayed on, the log backend was
# still compiled, but the UART device had been dropped from devicetree.
# Left this OFF for a while because of that error.
#
# After the ProMicro variant measured and confirmed the right switch
# (see prj.conf in Beacon_ProMicroNrf52840, ~0.7 mA of ~1.9 mA total),
# apply the same fix here: turn off BOTH
# CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM AND CONFIG_LOG at the same time
# (do not split), because CONFIG_LOG=n is what drops log_backend_uart.c
# from the build and avoids the earlier undefined-reference error.
#
# DEBUG NOTE: turning these off means NO COM port and NO log. When you
# need logs, build with debug.conf to bring them back (see README, Build).
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_LOG=n

# [POWER] APPROACH A (continuous low-power advertising):
#  - CPU auto-sleeps (System ON idle) between transmits: Zephyr's idle
#    thread handles this - no config needed.
#  - DC/DC regulator: ALREADY ENABLED via the board devicetree (reg1 =
#    DCDC mode); nRF52's soc.c reads that property and calls
#    nrf_power_dcdcen_set(true) at boot, so NO extra config here.
#    (Verified against soc/nordic/nrf52/soc.c.)
#  - 1 s interval (bmt_config.h) and TX -4 dBm already set.
# => Approach A is close to optimal by construction; real current
#    measurement needs a Power Profiler (PPK2).
