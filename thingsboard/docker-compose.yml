version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: tb-postgres
    environment:
      POSTGRES_DB: thingsboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - tb-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  thingsboard:
    image: thingsboard/tb-postgres:3.7.0
    container_name: thingsboard
    depends_on:
      - postgres
    ports:
      - "8080:9090"   # Web UI:  http://localhost:8080
      - "1883:1883"   # MQTT broker plaintext (fallback / test)
      - "8883:8883"   # MQTT broker TLS (MQTTS) - ESP32 connect here
      - "7070:7070"   # Edge RPC (optional)
    environment:
      TB_QUEUE_TYPE: in-memory
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/thingsboard
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      # ---- MQTT SSL (MQTTS) config ----
      MQTT_SSL_ENABLED: "true"
      MQTT_SSL_BIND_ADDRESS: "0.0.0.0"
      MQTT_SSL_BIND_PORT: "8883"
      MQTT_SSL_CREDENTIALS_TYPE: PEM
      MQTT_SSL_PEM_CERT: /config/mqttserver.pem
      MQTT_SSL_PEM_KEY: /config/mqttserver_key.pem
      # server.key has no passphrase, so leave this empty.
      MQTT_SSL_PEM_KEY_PASSWORD: ""
    volumes:
      - tb-data:/data
      - tb-logs:/var/log/thingsboard
      # Mount cert into the container (path relative to the directory
      # holding docker-compose.yml).
      - ./tls/server.pem:/config/mqttserver.pem:ro
      - ./tls/server.key:/config/mqttserver_key.pem:ro
    restart: unless-stopped

  # [OTA] HTTPS server that serves firmware .bin files for ESP32 to
  # download - replaces the manual `python -m http.server` step
  # before every OTA. Mounts the repo's firmware/ directory
  # (read-only): build the app, the .bin lands there, nodes can
  # download it.
  # [SECURITY] Only HTTPS (8443) - the old plain HTTP (8081) was
  # dropped: anyone on the LAN could pull the .bin and read
  # plaintext secrets (WiFi password, ThingsBoard token, ...)
  # without physical access to the board. Reuses the same CA / cert
  # pair as MQTTS (single physical server, no separate CA needed).
  ota-fileserver:
    image: nginx:alpine
    container_name: bmt-ota-server
    ports:
      - "8443:443"
    volumes:
      - ../firmware:/usr/share/nginx/html:ro
      - ./ota-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls/server.pem:/etc/nginx/certs/server.pem:ro
      - ./tls/server.key:/etc/nginx/certs/server.key:ro
    restart: unless-stopped

volumes:
  tb-postgres-data:
  tb-data:
  tb-logs:
